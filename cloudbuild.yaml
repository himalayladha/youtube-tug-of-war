steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tug-of-war:$COMMIT_SHA', '.']

  # 2. Push the Docker image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tug-of-war:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tug-of-war'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tug-of-war:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--no-cpu-throttling'
      - '--min-instances'
      - '1'
      - '--set-env-vars'
      - 'YOUTUBE_API_KEY=$_YOUTUBE_API_KEY'

images:
  - 'gcr.io/$PROJECT_ID/tug-of-war:$COMMIT_SHA'
